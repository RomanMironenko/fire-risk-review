<!doctype html>
<html lang="{{ site.lang | default: 'ru' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta
    name="description"
    content="{{ page.description | default: site.description | escape }}"
  >

  <meta name="theme-color" content="#7f1d1d">

  <title>{{ page.title | default: site.title | escape }}</title>

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%237f1d1d'/%3E%3Cpath d='M18 33l9 9 19-22' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
  >

  <link rel="stylesheet" href="./assets/css/style.css">

  <script>
    window.MathJax = {
      tex: {
        inlineMath: {
          '[+]': [['$', '$']]
        }
      }
    };
  </script>

  <script
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js">
  </script>
</head>

<body>
  <main class="page">
    {{ content }}
  </main>
</body>
</html>
